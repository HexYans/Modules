name: Spotify Premium
description: Spotify Premium
author: HexYans
icon: "https://cdn.nodeimage.com/i/8vygBRNBN0vG9E2aaeShetE6NmQr58UZ.webp"
rules:
  - and:
      match:
        - domain_suffix:
            match: spotify.com
        - protocol:
            match: quic
      policy: REJECT
  - domain:
      match: aet.spotify.com
      policy: REJECT

header_rewrites:
  - delete:
      match: ^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/user-customization-service\/v1\/customize$
      name: if-none-match
      type: request

rewrites:
  - match: ^https:\/\/(spclient\.wg|.*-spclient)\.spotify\.com(:443)?\/pendragon
    actions:
      - respond:
          status: 404
  - match: ^https:\/\/.*-spclient\.spotify\.com(:443)?\/pam-view-service\/
    actions:
      - respond:
          status: 404
  - match: ^https:\/\/.*37i9dQZF1EYkqdzj48dyYq
    actions:
      - respond:
          status: 404

scriptings:
  - http_response:
      name: spotify-search
      match: ^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/browsita\/v.\/browse
      script_url: https://raw.githubusercontent.com/HexYans/JavaScript/refs/heads/main/Spotify_Search.js
      max_size: 0
      body_required: true
      binary_body: true
  - http_response:
      name: spotify-scroll
      match: ^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/scrollsita\/v.\/scroll\/spotify
      script_url: https://raw.githubusercontent.com/HexYans/JavaScript/refs/heads/main/Spotify_Scroll.js
      max_size: 0
      body_required: true
      binary_body: true
  - http_request:
      name: spotify-gabo
      match: ^https:\/\/(.*-spclient\.spotify\.com(:443)?|spclient\.wg\.spotify\.com)\/gabo-receiver-service
      script_url: https://raw.githubusercontent.com/HexYans/JavaScript/refs/heads/main/Spotify_Gabo.js
      body_required: false
  - http_response:
      name: spotify-proto
      match: ^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/(bootstrap\/v1\/bootstrap|user-customization-service\/v1\/customize)$
      script_url: https://raw.githubusercontent.com/HexYans/JavaScript/refs/heads/main/Spotify_Proto.js
      max_size: 0
      body_required: true
      binary_body: true
      update_interval: 0

mitm:
  hostnames:
    includes:
      - spclient.wg.spotify.com
      - '*spclient.spotify.com'
